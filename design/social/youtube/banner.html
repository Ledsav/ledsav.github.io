<!doctype html>
<!-- ledsav_dev YouTube banner source. Render at 2560x1440 from this folder:
     chrome --headless=new --hide-scrollbars --window-size=2560,1440 --virtual-time-budget=8000 --screenshot=youtube-banner.png banner.html
     Everything important sits inside YouTube's 1546x423 safe area (centred).
     Add ?guides to the URL to draw the device crop guides.
     Same system as the site: Archivo extra-condensed + Doto, black, ember only as
     1-bit pixels. The glow is the old ember glow, ordered-dithered on a canvas,
     kept below the text so nothing competes with it. -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Doto:wght@900&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2560px;height:1440px;overflow:hidden;background:#0e0f11}
  .stage{position:relative;width:2560px;height:1440px;overflow:hidden;background:#0e0f11}
  canvas{position:absolute;inset:0;width:2560px;height:1440px;image-rendering:pixelated}
  /* YouTube safe area: 1546x423, centred */
  .safe{position:absolute;left:507px;top:508.5px;width:1546px;height:423px;display:flex;align-items:center;justify-content:center;gap:64px}
  .mark{width:250px;height:250px;flex:none}
  .text{display:flex;flex-direction:column;gap:24px}
  .name{font-family:Archivo,sans-serif;font-weight:900;font-stretch:62.5%;font-size:200px;line-height:.86;
        text-transform:uppercase;color:#f0eee9;white-space:nowrap}
  .name b{color:#ff5c33;font-weight:900}
  .tag{font-family:Doto,monospace;font-weight:900;font-size:32px;letter-spacing:.04em;color:rgba(233,231,226,.72);white-space:nowrap}
  .tag b{color:#ff5c33}
  .sub{font-family:Archivo,sans-serif;font-weight:400;font-size:36px;color:rgba(233,231,226,.72)}
  /* crop guides (only with ?guides) */
  .g{position:absolute;border:3px dashed #39f;pointer-events:none;display:none}
  .guides .g{display:block}
  .g span{position:absolute;left:8px;top:4px;font:600 22px Archivo;color:#39f}
</style></head><body>
<div class="stage" id="stage">
  <canvas id="glow" width="320" height="180"></canvas>
  <div class="safe">
    <img class="mark" src="../../../assets/logos/avr/avr-symbol-dark.svg" alt="">
    <div class="text">
      <div class="name">ledsav<b>_dev</b></div>
      <div class="tag">COOL AI TOOLS <b>/</b> DEV TOOLS <b>/</b> VS CODE EXTENSIONS <b>/</b> BUILDS</div>
      <div class="sub">Code at the edge of human biology.</div>
    </div>
  </div>
  <div class="g" style="left:0;top:0;width:2560px;height:1440px"><span>TV 2560×1440</span></div>
  <div class="g" style="left:0;top:508.5px;width:2560px;height:423px"><span>Desktop max 2560×423</span></div>
  <div class="g" style="left:507px;top:508.5px;width:1546px;height:423px"><span>Safe area 1546×423 (all devices)</span></div>
</div>
<script>
  if (/guides/.test(location.search)) document.getElementById("stage").classList.add("guides");

  // Ember glow, ordered-dithered (8x8 Bayer) into 8px pixels: 320x180 cells.
  // Same two ellipses as the old gradient, kept below the text block.
  (function () {
    var c = document.getElementById("glow"), x = c.getContext("2d");
    var W = c.width, H = c.height, id = x.createImageData(W, H), d = id.data;
    var B = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,
             3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
    function lobe(px, py, cx, cy, rx, ry) {
      var dx = (px - cx) / rx, dy = (py - cy) / ry;
      return Math.exp(-2.2 * (dx * dx + dy * dy));
    }
    for (var j = 0; j < H; j++) for (var i = 0; i < W; i++) {
      var px = i * 8 + 4, py = j * 8 + 4;
      var f = Math.max(lobe(px, py, 1280, 1120, 1000, 330), 0.75 * lobe(px, py, 1280, 1500, 1500, 460));
      // No stray pixels in the faint tail, and nothing behind the text: the
      // glow fades in from just under the subtitle (y 880 -> 1000).
      f = Math.max(0, f - 0.08) / 0.92;
      f *= Math.min(1, Math.max(0, (py - 880) / 120));
      if ((B[(j & 7) * 8 + (i & 7)] + 0.5) / 64 < f * 0.9) {
        var o = (j * W + i) * 4;
        d[o] = 255; d[o + 1] = 92; d[o + 2] = 51; d[o + 3] = 255;
      }
    }
    x.putImageData(id, 0, 0);
  })();
</script>
</body></html>
