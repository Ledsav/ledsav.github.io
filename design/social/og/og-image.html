<!doctype html>
<!-- Link preview (Open Graph / Twitter card) source. Render at 1200x630 from this folder:
     chrome --headless=new --force-prefers-reduced-motion --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 --screenshot=og.png og-image.html
     then save as assets/images/og-image.jpg. Reduced motion parks the scan line across the eyes.
     The portrait is drawn by the site's own js/hero.js, with coarser pixels (data-across)
     so it still reads as a bitmap when feeds shrink the card to ~500px wide. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Doto:wght@900&display=block" rel="stylesheet" />
<link rel="stylesheet" href="../../../css/main.css" />
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--bg);
  }
  .og-main {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: var(--sp-5);
    padding: 0 56px;
  }
  .og .hero-tags span { font-size: 16px; padding: var(--sp-1) var(--sp-2); }
  .og-name {
    align-self: flex-start;
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    font-stretch: 62.5%;
    font-size: 112px;
    line-height: 1.04;
    text-transform: uppercase;
    color: var(--text-bright);
  }
  .og-name span { display: block; }
  .og-role { font-size: 22px; color: var(--text-2); }
  .og-domain {
    font-family: var(--dots);
    font-weight: 900;
    font-size: 18px;
    letter-spacing: var(--track-dots);
    color: var(--text-3);
  }
  .og .hero-barcode { top: 56px; right: 56px; animation: none; }
  .og .hero-tags { animation: none; }
</style>
</head>
<body>
<section class="og" id="home">
  <canvas class="hero-canvas" id="heroCanvas" data-across="200" data-src="../../../assets/images/about/profile.webp" aria-hidden="true"></canvas>
  <div class="og-main">
    <div class="hero-tags"><span>FULL STACK</span><span>BIOMEDICAL</span></div>
    <h1 class="og-name" id="heroTitle"><span>Alberto</span><span>Valdés</span><span>Rey</span></h1>
    <p class="og-role">Full Stack Developer &amp; Biomedical Engineer in Luxembourg</p>
    <p class="og-domain">ALBERTOVALDESREY.COM</p>
  </div>
  <div class="hero-barcode" aria-hidden="true">
    <div class="hero-bars"><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b0"></i><i class="b1"></i><i class="b1"></i><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b0"></i><i class="b1"></i><i class="b1"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b1"></i><i class="b0"></i><i class="b1"></i><i class="b1"></i><i class="b0"></i></div>
    <small>LEDSAV</small>
  </div>
</section>
<script src="../../../js/hero.js"></script>
</body>
</html>
